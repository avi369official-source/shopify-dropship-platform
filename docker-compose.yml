services:
  postgres:
    image: postgres:16-alpine
    container_name: shopify_dropship_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropship_admin
      POSTGRES_PASSWORD: dropship_secure_pass_2026
      POSTGRES_DB: shopify_dropship_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropship_admin -d shopify_dropship_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopify_dropship_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
